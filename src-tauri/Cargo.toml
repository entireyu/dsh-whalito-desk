[package]
name = "dsh-launcher"
version = "0.5.0"
description = "鲸仔（Whalito）— DeepSeek Harness 一键安装与启动桌面助手"
authors = ["dsh-launcher"]
license = "MIT"
edition = "2021"

# exe 二进制名（用户可见），与内部 crate 名 dsh-launcher 解耦
[[bin]]
name = "Whalito"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
tungstenite = "0.24"
zip = "2"
dirs = "6"
# 系统剪贴板（内嵌 DSH 页面右键菜单的复制/剪切/粘贴由父窗口代为读写）
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# macOS：桌宠窗口需要透明（transparent）+ 无阴影（shadow），
# 这两个 API 在 macOS 上由 tauri 的 macos-private-api feature 提供
# （内部分发 ad-hoc 签名可用；该 feature 使用 Apple 私有 API，不能上架 App Store）。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
